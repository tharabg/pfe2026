version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: topnet_ocr_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: topnet_ocr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: topnet_ocr_api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: topnet_ocr
      DB_USER: postgres
      DB_PASSWORD: postgres
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # MLflow Tracking Server (for ML experiments)
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: topnet_ocr_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      mlflow server
      --backend-store-uri file:/app/mlruns
      --default-artifact-root /app/mlruns
      --host 0.0.0.0

  # Streamlit Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: topnet_ocr_dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./dashboard:/app
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: topnet_ocr_network
